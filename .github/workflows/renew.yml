name: Katabump Auto Renew

on:
  schedule:
  # 每天 UTC 0点 (北京时间 8点) 运行
  - cron: '0 0 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  renew:
    runs-on: ubuntu-latest
    environment: production

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Start Proxy (sing-box)
      env:
        PROXY_URL: ${{ secrets.PROXY_URL }}
      run: |
        if [ -z "$PROXY_URL" ]; then
          echo "PROXY_URL is not configured."
          exit 1
        fi
        set -euo pipefail
        singbox_ver="1.11.0"
        archive="sing-box-${singbox_ver}-linux-amd64.tar.gz"
        curl --retry 3 --retry-delay 3 --retry-all-errors -fsSL \
          -o "$archive" \
          "https://github.com/SagerNet/sing-box/releases/download/v${singbox_ver}/${archive}"
        tar -xzf "$archive"
        mv "sing-box-${singbox_ver}-linux-amd64/sing-box" ./sing-box
        chmod +x ./sing-box
        PROXY_URL="$PROXY_URL" python proxy_handler.py
        nohup ./sing-box run -c config.json > singbox.log 2>&1 &
        echo $! > singbox.pid
        ready=false
        for attempt in $(seq 1 30); do
          if curl -fsS --proxy http://127.0.0.1:8080 --max-time 20 \
              https://www.google.com/generate_204 -o /dev/null 2>/dev/null; then
            ready=true
            break
          fi
          echo "Proxy health check ${attempt}/30..."
          sleep 2
        done
        if [ "$ready" != true ]; then
          echo "sing-box proxy health check failed"
          tail -n 80 singbox.log || true
          exit 1
        fi
        echo "sing-box proxy is ready on http://127.0.0.1:8080"

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb
        npm install
        npx playwright install-deps chrome

    - name: Run Renew Script
      env:
        USERS_JSON: ${{ secrets.USERS_JSON }}
        HTTP_PROXY: ''
        PROXY_URL: ${{ secrets.PROXY_URL }}
        TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
      run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" node action_renew.js

    - name: Upload Screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: screenshots
        path: screenshots/
